fragment BetReport on V3_Bet {
  id
  createdBlockTimestamp
  status
  result
  isCashedOut
  isFreebet
  isFreebetAmountReturnable
  isRedeemed
  rawAmount
  rawPayout
  cashout {
    rawPayout
  }
  # a leg is voided exactly when its own result is Canceled. odds, outcome.result and condition.status are
  # not read by the report: they stay so the generated fragment type keeps every field it has exported
  selections {
    odds
    result
    outcome {
      result
      condition {
        status
      }
    }
  }
  core {
    liquidityPool {
      token
      tokenDecimals
    }
  }
}
