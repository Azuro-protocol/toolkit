fragment Bet on V3_Bet {
  id
  nonce
  tokenId: betId
  actor
  amount
  status
  potentialPayout
  payout # settled amount; voids the canceled sub-bets of an express only once the bet is redeemed
  result
  odds
  settledOdds # raw product of the leg odds with the feed fee compounded once per leg: NOT re-margined for an express and NOT reduced when a sub-bet is canceled, so it understates every combo - never derive a payout from it
  createdAt: createdBlockTimestamp
  resolvedAt: resolvedBlockTimestamp
  txHash: createdTxHash
  redeemedTxHash
  redeemedAt: redeemedBlockTimestamp
  affiliate
  isRedeemed
  isRedeemable
  isCashedOut
  core {
    address
    liquidityPool {
      address
    }
  }
  selections {
    odds
    result
    conditionKind
    outcome {
      outcomeId
      title
      result
      condition {
        conditionId
        title
        status
        gameId
        wonOutcomeIds
      }
    }
  }
  freebetId
  isFreebetAmountReturnable
  paymasterContractAddress
  cashout {
    payout
  }
}
