fragment Bet on V3_Bet {
  id
  nonce
  tokenId: betId
  actor
  amount
  status
  potentialPayout
  payout # settled amount; already voids canceled sub-bets of an express
  result
  odds
  settledOdds # a copy of `odds`: NOT reduced when a sub-bet of an express is canceled, never derive a payout from it
  createdAt: createdBlockTimestamp
  resolvedAt: resolvedBlockTimestamp
  txHash: createdTxHash
  redeemedTxHash
  redeemedAt: redeemedBlockTimestamp
  affiliate
  isRedeemed
  isRedeemable
  isCashedOut
  core {
    address
    liquidityPool {
      address
    }
  }
  selections {
    odds
    result
    conditionKind
    outcome {
      outcomeId
      title
      result
      condition {
        conditionId
        title
        status
        gameId
        wonOutcomeIds
      }
    }
  }
  freebetId
  isFreebetAmountReturnable
  paymasterContractAddress
  cashout {
    payout
  }
}
