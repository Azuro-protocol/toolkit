fragment Bet on V3_Bet {
  id
  nonce
  tokenId: betId
  actor
  amount
  rawAmount
  status
  potentialPayout
  rawPotentialPayout
  # the pool's payout: the stake times settledOdds for a won bet, 0 for a lost one, the stake for a canceled
  # one; once redeemed, the amount actually paid; a cash-out leaves it unchanged. A freebet's goes to the
  # freebet contract, which pays the bettor only a share of it - see calcFreebetBettorShare
  payout
  rawPayout
  result
  odds
  # the odds the bet settled at: the placed odds when lost, the surviving legs combined when won (a voided
  # leg is left out), exactly 1 when canceled
  settledOdds
  createdAt: createdBlockTimestamp
  resolvedAt: resolvedBlockTimestamp
  txHash: createdTxHash
  redeemedTxHash
  redeemedAt: redeemedBlockTimestamp
  affiliate
  isRedeemed
  isRedeemable
  isCashedOut
  core {
    address
    liquidityPool {
      address
      tokenDecimals
    }
  }
  selections {
    odds
    result
    conditionKind
    outcome {
      outcomeId
      title
      result
      condition {
        conditionId
        title
        status
        gameId
        wonOutcomeIds
      }
    }
  }
  freebetId
  isFreebetAmountReturnable
  paymasterContractAddress
  cashout {
    payout
  }
}
